# 打包配置（electron-builder）：pnpm build-app 在本机产出 mac dmg + Windows 安装包
# 安装包 version 由 scripts/electron-builder.mjs 打成 1.0.0-yyyyMMdd（勿在此写死日期）
# Linux 上由 scripts/electron-builder.mjs 覆盖：mac → dir（.app），win 跳过 wine/signtool
appId: com.super-go.app
productName: Super Go
directories:
  output: dist
  buildResources: build
# asar 只含编译产物（依赖已内联 bundle，见 electron.vite.config.ts）
files:
  - out/**
  - package.json
  - '!**/*.map'
  # 安装包不发布 Linux；这两份原生库只在别的平台用
  - '!**/onnxruntime-node/bin/**/linux/**'
  - '!**/node_modules/@nut-tree/libnut-linux/**'
asarUnpack:
  - '**/*.node'
compression: maximum
# Chromium 语言包只留界面实际支持的（中/英/日）；不切会多带 ~45MB .pak
electronLanguages:
  - en
  - en-US
  - en_US
  - zh
  - zh-CN
  - zh_CN
  - zh-TW
  - zh_TW
  - ja
afterPack: ./scripts/slim-unpacked.mjs
# 连线识别模型随包分发（10MB，双平台共用；GPLv3 来源已决策接受，见 AGENTS.md）
# LICENSE / NOTICE 一并放入 Resources，满足 GPLv3 随附许可证与第三方声明
extraResources:
  - from: ../../engines/vision
    to: engines/vision
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE.md
    to: NOTICE.md
  - from: ../../licenses
    to: licenses
# 无签名证书：跳过公证流程（产物仍可右键打开/安装）
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64]
  identity: null
  extendInfo:
    LSMinimumSystemVersion: '12.0'
  # 引擎随包分发：只带本平台二进制 + NNUE（51MB）
  extraResources:
    - from: ../../engines/chess
      to: engines/chess
      filter:
        - '*/MacOS/**'
win:
  target:
    - target: nsis
      arch: [x64]
  requestedExecutionLevel: asInvoker
  # 全部 CPU 变体都带上（每个 1.5MB）：安装机自动命中（avx512icl 优先），
  # 9950X3D（Zen5，AVX-512）命中 pikafish-avx512icl.exe
  extraResources:
    - from: ../../engines/chess
      to: engines/chess
      filter:
        - '*/*.exe'
        - '*/pikafish.nnue'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 分发文件名用 Super-Go；productName 仍是 Super Go（菜单栏 / 快捷方式）
  artifactName: Super-Go-${version}-setup.${ext}
dmg:
  artifactName: Super-Go-${version}-${arch}.${ext}
